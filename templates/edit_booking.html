{% extends 'base.html' %}
{% block content %}
<h1>Edit Booking</h1>
<div class="card">
  <form method="post" class="form-grid">
    <label>Guest Name<input name="guest_name" value="{{ booking.guest_name }}" required></label>
    <label>Contact<input name="contact" value="{{ booking.contact or '' }}"></label>
    <label>Email<input name="email" value="{{ booking.email or '' }}"></label>
    <label>Check-in<input type="date" name="checkin" value="{{ booking.checkin or '' }}"></label>
    <label>Check-out<input type="date" name="checkout" value="{{ booking.checkout or '' }}"></label>
    <label>Room Type<input name="room_type" value="{{ booking.room_type or '' }}"></label>
    <label>Rooms<input type="number" name="rooms" min="1" value="{{ booking.rooms or 1 }}"></label>
    <label>Adults<input type="number" name="adults" min="0" value="{{ booking.adults or 0 }}"></label>
    <label>Children &lt;6<input type="number" name="child_under_6" min="0" value="{{ booking.child_under_6 or 0 }}"></label>
    <label>Children &gt;6<input type="number" name="child_above_6" min="0" value="{{ booking.child_above_6 or 0 }}"></label>
    <label>Net Rate<input type="number" step="0.01" name="net_rate" value="{{ booking.net_rate or 0 }}"></label>
    <label>Advance Paid<input type="number" step="0.01" name="advance_paid" value="{{ booking.advance_paid or 0 }}"></label>
    <label>Payment Mode<input name="payment_mode" value="{{ booking.payment_mode or '' }}"></label>
    <label>Booking Source<input name="booking_source" value="{{ booking.booking_source or '' }}"></label>
    <label>Meal Plan<input name="meal_plan" value="{{ booking.meal_plan or '' }}"></label>
    <label>Status<input name="status" value="{{ booking.status or 'Confirmed' }}"></label>
    <label class="full">Special Request<textarea name="special_request" rows="3">{{ booking.special_request or '' }}</textarea></label>
    <button type="submit">Update Booking</button>
  </form>
</div>
{% endblock %}
