{% extends 'base.html' %}
{% block content %}
<h1>Structured Booking Entry</h1>
<form method="post" class="card form-grid">
  <label>Resort
    <select name="resort_id" required>
      <option value="">Select resort</option>
      {% for r in resorts %}
      <option value="{{ r.id }}">{{ r.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Guest Name<input name="guest_name" required></label>
  <label>Contact<input name="contact"></label>
  <label>Email<input name="email"></label>
  <label>Check-in<input type="date" name="checkin"></label>
  <label>Check-out<input type="date" name="checkout"></label>
  <label>Room Type<input name="room_type"></label>
  <label>Rooms<input type="number" name="rooms" min="1" value="1"></label>
  <label>Adults<input type="number" name="adults" min="0" value="1"></label>
  <label>Children under 6<input type="number" name="child_under_6" min="0" value="0"></label>
  <label>Children above 6<input type="number" name="child_above_6" min="0" value="0"></label>
  <label>Net Rate<input type="number" step="0.01" name="net_rate" value="0"></label>
  <label>Advance Paid<input type="number" step="0.01" name="advance_paid" value="0"></label>
  <label>Payment Mode
    <select name="payment_mode">
      <option value="">Select</option>
      <option>UPI</option>
      <option>Cash</option>
      <option>Card</option>
      <option>Bank Transfer</option>
    </select>
  </label>
  <label>Booking Source
    <select name="booking_source">
      <option value="">Select</option>
      <option>Direct</option>
      <option>Booking.com</option>
      <option>Airbnb</option>
      <option>Agoda</option>
      <option>MakeMyTrip</option>
      <option>Goibibo</option>
    </select>
  </label>
  <label>Meal Plan<input name="meal_plan" placeholder="Breakfast Included"></label>
  <label>Status
    <select name="status">
      <option>Confirmed</option>
      <option>Checked-in</option>
      <option>Checked-out</option>
      <option>Cancelled</option>
    </select>
  </label>
  <label class="full">Special Request<textarea name="special_request" rows="4"></textarea></label>
  <button type="submit">Save Booking</button>
</form>
{% endblock %}
